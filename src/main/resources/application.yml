# Local defaults. Credentials and password hashes come from the environment, never from this file.
spring:
  application:
    name: ledgercore
  datasource:
    # The application connects as ledger_app, which cannot update or delete journal history.
    url: ${LEDGERCORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/ledgercore}
    username: ${LEDGERCORE_DB_APP_USER:ledger_app}
    password: ${LEDGERCORE_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # Bounded waits: a lock wait longer than 2 s fails with a retryable error instead of hanging.
        options: "-c lock_timeout=2s -c statement_timeout=5s -c transaction_timeout=10s"
  flyway:
    # Migrations run as the schema owner; the owner role is not used for requests.
    url: ${LEDGERCORE_DB_URL:jdbc:postgresql://127.0.0.1:5432/ledgercore}
    user: ${LEDGERCORE_DB_OWNER_USER:ledger_owner}
    password: ${LEDGERCORE_DB_OWNER_PASSWORD:}

logging:
  pattern:
    # Every log line carries the request ID (HTTP requests) or event ID (outbox deliveries) from the MDC.
    level: "%5p [%X{requestId:-}%X{eventId:-}]"
  # Optional JSON log file (Elastic Common Schema) for diagnostics. Off unless LEDGERCORE_LOG_FILE is
  # set; console output is unchanged either way.
  file:
    name: ${LEDGERCORE_LOG_FILE:}
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      # Rolled files stay uncompressed, so a log reader can finish a file after it is rotated.
      file-name-pattern: ${LEDGERCORE_LOG_FILE:ledgercore.log}.%d{yyyy-MM-dd}.%i
  level:
    # Delivery-attempt, poll-batch and startup-config records. Off by default; set to INFO to record them.
    ledgercore.diagnostics: ${LEDGERCORE_DIAGNOSTICS_LOG_LEVEL:OFF}

server:
  address: 127.0.0.1
  port: ${LEDGERCORE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      # Fixed histogram buckets (exported in seconds), so latency percentiles can be computed from
      # bucket counts instead of averaging per-instance summaries.
      slo:
        "[http.server.requests]": 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
        "[ledgercore.outbox.delivery]": 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,3s,5s
        "[ledgercore.outbox.poll]": 10ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,controlAccount

ledgercore:
  limits:
    max-amount-minor: 1000000000000
    max-request-bytes: 16384
    default-page-size: 50
    max-page-size: 100
    max-idempotency-key-length: 128
  security:
    # Each username maps to an immutable principal subject seeded by migration V2.
    # Hashes use Spring's delegating format, for example {bcrypt}$2a$10$...
    users:
      - username: customer-a
        subject: "local:customer-a"
        password-hash: ${LEDGERCORE_CUSTOMER_A_PASSWORD_HASH:}
      - username: customer-b
        subject: "local:customer-b"
        password-hash: ${LEDGERCORE_CUSTOMER_B_PASSWORD_HASH:}
      - username: demo-admin
        subject: "local:demo-admin"
        password-hash: ${LEDGERCORE_ADMIN_PASSWORD_HASH:}
  outbox:
    poller-enabled: true
    poll-interval: 1s
    batch-size: 20
    delivery-timeout: 3s
    max-attempts: 8
    backoff-base: 1s
    backoff-max: 60s
    # Empty means this application's own demonstration consumer on loopback.
    consumer-url: ${LEDGERCORE_CONSUMER_URL:}
    publisher-username: outbox-publisher
    publisher-password: ${LEDGERCORE_PUBLISHER_PASSWORD:}
  demo-consumer:
    username: outbox-publisher
    password-hash: ${LEDGERCORE_PUBLISHER_PASSWORD_HASH:}
  diagnostics:
    # Read-only scrape login for /actuator/prometheus. It cannot call /v1/** or other actuator endpoints.
    username: diagnostics-reader
    password-hash: ${LEDGERCORE_DIAGNOSTICS_PASSWORD_HASH:}
    # Source revision reported in the startup config record, passed in by whoever launches the jar.
    revision: ${LEDGERCORE_REVISION:unknown}
